[package]
name = "edge-tts-android-rust"
version = "0.1.4"
edition = "2024"

[lib]
name = "edge_tts_android"
crate-type = ["cdylib"]

[dependencies]
edge-tts-rust = { git = "https://github.com/Initsnow/edge-tts-rust", rev = "6225acf54a233839827e868c794633d1bd35d4f8" }
futures-util = "0.3"
jni = "0.21"
minimp3 = "0.5"
once_cell = "1.21"
opus = "0.3"
webm-iterable = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
rubato = "0.16"
thiserror = "2.0"
toml = "0.8"

[profile.dev]
debug = 1
strip = "debuginfo"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
